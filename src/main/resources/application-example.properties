# Copie este arquivo para application.properties (ignorado pelo Git) e ajuste os valores.
spring.application.name=blue-hawk

# Configuracoes do MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blue_hawk}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sua_senha_aqui}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desabilita a conversao de CamelCase para snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ProblemDetails
spring.mvc.problemdetails.enabled=true

# JWT (gere um segredo proprio com 32+ caracteres; nao use este valor fora do ambiente local)
security.jwt.secret=${JWT_SECRET:troque-por-um-segredo-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=86400
