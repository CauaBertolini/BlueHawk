name: Build and deploy BlueHawk

on:
  push:
    branches: [prd]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cauabertolini/bluehawk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Necessário para o login OIDC
      contents: read
    steps:
      # 1. Realiza o login na Azure via OIDC (federated credential criada pelo Centro de Implantação)
      - name: Login na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6312971B82604232AB35E8A373731954 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11AD725961C047E48250EECFA6518775 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D54CB150E7764EFAB2CF57F9612A7EAC }}

      # 2. Realiza o deploy utilizando a sessão autenticada
      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: bluehawk
          images: ghcr.io/cauabertolini/bluehawk:${{ github.sha }}
