services:
  postgres:
    image: postgres:18.6
    container_name: bluehawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blue_hawk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sua_senha_aqui
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
